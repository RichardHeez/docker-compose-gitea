<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Output — Lumen</title>
  <link rel="stylesheet" href="/css/slide.css">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body.transparent, body.transparent .stage-host { background: transparent; }
    #host { position: fixed; inset: 0; }
    body.hide-cursor { cursor: none; }
    #hint { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 9; font: 500 14px Inter, system-ui, sans-serif; color: #fff;
      background: rgba(20,22,35,.85); border: 1px solid rgba(255,255,255,.15); padding: 10px 16px; border-radius: 12px; transition: opacity .4s; pointer-events: none; }
    #ident { position: fixed; inset: 0; display: none; place-items: center; z-index: 10; font: 700 18vw Inter, sans-serif; color: #ffd27a; background: rgba(0,0,0,.6); }
    #offline { position: fixed; top: 10px; right: 10px; width: 10px; height: 10px; border-radius: 50%; background: #e5484d; display: none; z-index: 11; }
  </style>
</head>
<body>
  <div id="host" class="stage-host"></div>
  <div id="hint">Double-click or press F for fullscreen</div>
  <div id="ident"></div>
  <div id="offline" title="Disconnected from console"></div>
  <script type="module" src="/js/output.js"></script>
</body>
</html>
